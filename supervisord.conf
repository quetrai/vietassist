[supervisord]
nodaemon=true
loglevel=info
user=root

[program:web]
command=/bin/sh -c 'exec uvicorn web:app --host 0.0.0.0 --port 10000'
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:zalo]
command=/bin/sh -c 'if [ "$ZALO_ENABLED" = "true" ]; then exec node --max-old-space-size=128 /app/zalo-gateway/dist/index.js; else exec tail -f /dev/null; fi'
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
