[supervisord]
nodaemon=true

[program:web]
command=uvicorn web:app --host 0.0.0.0 --port 10000
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

[program:zalo]
command=/bin/sh -c 'if [ "$ZALO_ENABLED" = "true" ]; then node /app/zalo-gateway/dist/index.js; else tail -f /dev/null; fi'
priority=20
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
